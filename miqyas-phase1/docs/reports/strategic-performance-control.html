<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>لوحة تحكم تقرير الأداء — مِقياس</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --maroon: #951740; --gold: #e9b221; }
    body {
      margin: 0; font-family: "Tajawal", sans-serif;
      background: linear-gradient(160deg, #fff8ef, #f0e0d0);
      color: #1f1220; min-height: 100vh; padding: 2rem;
    }
    .panel {
      max-width: 720px; margin: 0 auto; background: #fff;
      border: 2px solid rgba(149,23,64,.15); border-radius: 18px; padding: 1.75rem;
      box-shadow: 0 16px 40px rgba(31,18,32,.08);
    }
    h1 { margin: 0 0 .35rem; color: var(--maroon); }
    .actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.25rem; }
    a, button {
      font: inherit; text-decoration: none; border: 0; border-radius: 10px;
      padding: .7rem 1.1rem; cursor: pointer; font-weight: 700;
    }
    .primary { background: var(--maroon); color: #fff; }
    .secondary { background: var(--gold); color: #6e1030; }
    .hint { margin-top: 1rem; color: #6b4b55; line-height: 1.7; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>لوحة تحكم تقرير العرض</h1>
    <p>إنشاء/فتح العرض التقديمي المعتمد على نموذج Apps Script (ألوان maroon/gold · مسرح 1600×900).</p>
    <div class="actions">
      <a class="primary" href="./strategic-performance-deck.html" target="_blank" rel="noreferrer">فتح العرض</a>
      <a class="secondary" href="/admin/report">فتح من منصة مِقياس</a>
    </div>
    <p class="hint">
      في المنصة تُسحب بيانات FINAL_APPROVED لسنة/فترة جولة القياس من الإعدادات.
      هذا الملف مرجع هيكلي للنموذج؛ التشغيل الحي عبر <code>/admin/report</code>.
    </p>
  </div>
</body>
</html>
